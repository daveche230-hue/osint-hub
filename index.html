<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OSINT Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0d1218; --s1:#151c25; --s2:#1d2632; --line:rgba(255,255,255,.07);
    --fg:#eef2f6; --mut:#8593a3; --acc:#3aa8f0; --acc-fg:#05131f;
    --ok:#5ccf8b; --er:#ff7a7a; --errbg:rgba(255,122,122,.12);
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg:#f1f4f8; --s1:#ffffff; --s2:#e8edf3; --line:rgba(0,0,0,.08);
    --fg:#0f161d; --mut:#627083; --acc:#1b8fd8; --acc-fg:#ffffff;
    --ok:#1d9a55; --er:#d23d3d; --errbg:rgba(210,61,61,.10);
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    padding:0 16px calc(36px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    -webkit-font-smoothing:antialiased;
  }
  /* единственный декоративный момент: мягкое свечение за заголовком */
  body::before{
    content:"";position:fixed;inset:0 0 auto 0;height:260px;pointer-events:none;z-index:-1;
    background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 65%);
  }
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .hide{display:none!important}

  /* шапка */
  .head{padding:22px 2px 14px}
  .head h1{margin:0;font-size:30px;line-height:1.1;font-weight:750;letter-spacing:-.02em}
  .head p{margin:6px 0 0;color:var(--mut);font-size:14px}

  /* липкая панель поиска */
  .bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px 6px;background:linear-gradient(var(--bg) 80%,transparent)}
  .srch{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:52px;transition:border-color .15s,box-shadow .15s}
  .srch:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
  .srch svg{width:20px;height:20px;flex:0 0 20px;color:var(--mut)}
  .srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:16px}
  .srch input::placeholder{color:var(--mut)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin:0 -16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--mut);cursor:pointer;transition:background .15s,color .15s}
  .chip.on{background:var(--fg);color:var(--bg);border-color:transparent}

  /* подсказка по введённым данным */
  .sg{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;text-align:left;cursor:pointer;
      background:color-mix(in srgb,var(--acc) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:16px}
  .sg b{display:block;font-size:14.5px;font-weight:650}
  .sg span{display:block;font-size:13px;color:var(--mut)}
  .sg svg{width:18px;height:18px;flex:0 0 18px;margin-left:auto;color:var(--acc)}

  .note{font-size:13px;color:var(--mut);margin:14px 4px 0}

  /* списки инструментов */
  .gh{font-size:13.5px;font-weight:600;color:var(--mut);margin:22px 4px 8px}
  .grp{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
  .item:last-child{border-bottom:0}
  .item:active{background:var(--s2)}
  .ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;
       background:var(--s2);background:color-mix(in srgb,var(--h) 17%,transparent);color:var(--h)}
  .ico svg{width:20px;height:20px}
  .tx{flex:1;min-width:0}
  .cn{font-size:15px;font-weight:600;line-height:1.25}
  .cd{font-size:12.5px;color:var(--mut);line-height:1.3;margin-top:1px}
  .chev{width:16px;height:16px;flex:0 0 16px;color:var(--mut);opacity:.6}
  .empty{text-align:center;color:var(--mut);padding:40px 0;font-size:14px}

  /* экран инструмента */
  #tool{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--acc);font-size:15px;font-weight:500;padding:14px 0 6px;cursor:pointer}
  .back svg{width:18px;height:18px}
  .th{display:flex;align-items:center;gap:13px;margin:8px 0 18px}
  .th .ico{width:46px;height:46px;flex-basis:46px;border-radius:14px}
  .th .ico svg{width:24px;height:24px}
  .th h2{margin:0;font-size:22px;line-height:1.15;font-weight:720;letter-spacing:-.01em}
  .th p{margin:3px 0 0;font-size:13.5px;color:var(--mut)}
  label.lb{display:block;font-size:13px;color:var(--mut);margin:0 2px 7px}
  input.f{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 15px;height:52px;color:var(--fg);font:inherit;font-size:16px;outline:0;transition:border-color .15s,box-shadow .15s}
  input.f:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
  .run{width:100%;height:52px;margin-top:14px;background:var(--acc);color:var(--acc-fg);border:0;border-radius:14px;font-size:16px;font-weight:650;cursor:pointer;transition:transform .1s,opacity .15s}
  .run:active{transform:scale(.985)}
  .run:disabled{opacity:.5}
  .out{margin-top:20px}
  .out h3{font-size:13.5px;font-weight:600;color:var(--mut);margin:20px 4px 8px}
  .out h3:first-child{margin-top:0}

  .row{display:flex;justify-content:space-between;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .k{color:var(--mut);flex:0 0 auto}
  .v{text-align:right;white-space:pre-line;word-break:break-all;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;user-select:text;-webkit-user-select:text}
  .ok{color:var(--ok)} .er{color:var(--er)}
  .pre{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
  .ll a{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:14.5px;font-weight:500}
  .ll a:last-child{border-bottom:0}
  .ll a:active{background:var(--s2)}
  .ll a span{color:var(--acc);font-size:13px;font-weight:500}
  .b2{background:var(--s1);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:14px;font-weight:550;margin:12px 8px 0 0;cursor:pointer}
  .b2:active{background:var(--s2)}
  .thumb{width:84px;height:84px;border-radius:16px;border:1px solid var(--line);object-fit:cover;display:block}
  .err{background:var(--errbg);border:1px solid color-mix(in srgb,var(--er) 45%,transparent);color:var(--er);border-radius:14px;padding:12px 14px;font-size:14px}
  .sp{display:inline-block;width:14px;height:14px;border:2px solid var(--mut);border-top-color:var(--acc);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes r{to{transform:rotate(360deg)}}
  .frow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
  .frow:last-child{border-bottom:0}
  .frow input{accent-color:var(--acc);width:19px;height:19px;margin:0}

  .star{margin-left:auto;background:none;border:0;padding:8px;color:var(--mut);cursor:pointer}
  .star svg{width:26px;height:26px}
  .star.on{color:#f2c14e}
  .star.on svg{fill:currentColor}
  .gh .clr{float:right;background:none;border:0;color:var(--acc);font-size:13px;font-weight:500;cursor:pointer;padding:0}
  .hv{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;word-break:break-all}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="list">
  <div class="head">
    <h1>OSINT Hub</h1>
    <p>Проверки по открытым источникам</p>
  </div>
  <div class="bar">
    <div class="srch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="q" placeholder="Вставь email, IP, домен, ник или номер" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>
    <div id="sgw"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="note">DNS, IP, email и хеши проверяются прямо здесь. Остальные инструменты открывают внешние сервисы.</div>
  <div id="grid"></div>
</div>

<div id="tool" class="hide"></div>

<script>
const tg = window.Telegram?.WebApp;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").trim().replace(/^@/,"");
const hap = () => { try{ tg?.HapticFeedback?.impactOccurred("light"); }catch(e){} };
const store = {
  get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
let favs = store.get("osint_fav",[]);
let hist = store.get("osint_hist",[]);

/* ---------- тема ---------- */
function applyTheme(){
  const dark = tg ? tg.colorScheme !== "light" : !matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try{ tg?.setHeaderColor?.(bg); tg?.setBackgroundColor?.(bg); tg?.setBottomBarColor?.(bg); }catch(e){}
}
if (tg) { tg.ready(); tg.expand(); tg.onEvent?.("themeChanged", applyTheme); }
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => { if(!tg) applyTheme(); });
applyTheme();

/* ---------- иконки и цвета категорий ---------- */
const I = {
  tg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M21 4 3 11l5 2 2 6 3-4 5 3z"/></svg>',
  nick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>',
  email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  dom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>',
  ip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7.5h.01M7 17h.01"/></svg>',
  geo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg>',
  util:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 6.5a4 4 0 1 0 5 5L21 17v3h-3l-5.5-5.5a4 4 0 0 0-5-5z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.9l-5.4 2.8 1.1-6.1L3.2 9.4l6.1-.8z"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>'
};
const HUE = {tg:"#3aa8f0",nick:"#b78cf5",email:"#f2a65a",phone:"#5ccf8b",dom:"#3cc9d6",ip:"#f27a8c",geo:"#e8c24f",code:"#8ea2ff",util:"#9aa8b6"};

/* ---------- данные ---------- */
const PLAT=[["GitHub","https://github.com/{u}"],["GitLab","https://gitlab.com/{u}"],["Reddit","https://www.reddit.com/user/{u}"],["X","https://x.com/{u}"],["Instagram","https://instagram.com/{u}"],["TikTok","https://tiktok.com/@{u}"],["VK","https://vk.com/{u}"],["OK","https://ok.ru/{u}"],["Facebook","https://facebook.com/{u}"],["LinkedIn","https://linkedin.com/in/{u}"],["Pinterest","https://pinterest.com/{u}"],["Telegram","https://t.me/{u}"],["YouTube","https://youtube.com/@{u}"],["Twitch","https://twitch.tv/{u}"],["Steam","https://steamcommunity.com/id/{u}"],["SoundCloud","https://soundcloud.com/{u}"],["Medium","https://medium.com/@{u}"],["Dev.to","https://dev.to/{u}"],["Habr","https://habr.com/ru/users/{u}/"],["Behance","https://behance.net/{u}"],["Dribbble","https://dribbble.com/{u}"],["Keybase","https://keybase.io/{u}"],["Kaggle","https://kaggle.com/{u}"],["HackerNews","https://news.ycombinator.com/user?id={u}"],["npm","https://npmjs.com/~{u}"],["Docker Hub","https://hub.docker.com/u/{u}"],["Patreon","https://patreon.com/{u}"],["Strava","https://strava.com/athletes/{u}"],["Bitbucket","https://bitbucket.org/{u}"],["Mastodon","https://mstdn.social/@{u}"]];
const CC=[["7","Россия / Казахстан"],["1","США / Канада"],["44","Великобритания"],["49","Германия"],["33","Франция"],["39","Италия"],["34","Испания"],["48","Польша"],["380","Украина"],["375","Беларусь"],["995","Грузия"],["374","Армения"],["994","Азербайджан"],["998","Узбекистан"],["90","Турция"],["971","ОАЭ"],["972","Израиль"],["86","Китай"],["81","Япония"],["91","Индия"],["55","Бразилия"],["31","Нидерланды"],["46","Швеция"],["41","Швейцария"],["420","Чехия"],["40","Румыния"],["370","Литва"],["371","Латвия"],["372","Эстония"]];

/* ---------- хеши ---------- */
/* MD5: в старой версии были неверные сдвиги и длина сообщения, из-за этого MD5 и Gravatar считались неправильно */
function md5(str){
  const S=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
  const K=Array.from({length:64},(_,i)=>Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0);
  const rl=(x,c)=>(x<<c)|(x>>>(32-c));
  const bytes=[...new TextEncoder().encode(str)];
  const bl=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  const lo=bl>>>0, hi=Math.floor(bl/4294967296);
  for(let i=0;i<4;i++)bytes.push((lo>>>(8*i))&255);
  for(let i=0;i<4;i++)bytes.push((hi>>>(8*i))&255);
  let a0=0x67452301|0,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476|0;
  for(let o=0;o<bytes.length;o+=64){
    const M=[];
    for(let i=0;i<16;i++)M[i]=bytes[o+i*4]|(bytes[o+i*4+1]<<8)|(bytes[o+i*4+2]<<16)|(bytes[o+i*4+3]<<24);
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i}
      else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}
      else if(i<48){F=B^C^D;g=(3*i+5)%16}
      else{F=C^(B|~D);g=(7*i)%16}
      F=(F+A+K[i]+M[g])|0;
      A=D;D=C;C=B;
      B=(B+rl(F,S[(i>>4)*4+(i&3)]))|0;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  const hx=n=>{let s="";for(let j=0;j<4;j++)s+=((n>>>(8*j))&255).toString(16).padStart(2,"0");return s};
  return hx(a0)+hx(b0)+hx(c0)+hx(d0);
}
async function sha(a,t){const d=await crypto.subtle.digest(a,new TextEncoder().encode(t));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function doh(n,t){const r=await fetch("https://dns.google/resolve?name="+encodeURIComponent(n)+"&type="+t);if(!r.ok)throw new Error("DNS "+r.status);return r.json()}

/* ---------- блоки вывода ---------- */
const rows = p => '<div class="grp">'+p.map(([k,v,c])=>`<div class="row"><div class="k">${esc(k)}</div><div class="v ${c||""}">${v}</div></div>`).join("")+'</div>';
const links = l => '<div class="grp ll">'+l.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}<span>открыть</span></a>`).join("")+'</div>';
const cpb = t => `<button class="b2" data-copy="${esc(t)}">Скопировать</button>`;

/* ---------- инструменты ---------- */
const T=[
{c:"tg",n:"Профиль Телеграм",d:"Ссылки и каталоги по юзернейму",p:"username без @",f:async v=>{
  const u=norm(v);if(!u)throw new Error("Введи юзернейм");
  return `<h3>Где посмотреть</h3>`+links([["t.me/"+u,"https://t.me/"+u],["Лента t.me/s/"+u,"https://t.me/s/"+u],["TGStat","https://tgstat.ru/channel/@"+u],["Telemetr","https://telemetr.me/@"+u],["Google",'https://www.google.com/search?q=%22@'+encodeURIComponent(u)+'%22']]);
}},
{c:"tg",n:"Поиск каналов",d:"Публичные каналы по теме",p:"ключевое слово",f:async v=>{
  if(!v.trim())throw new Error("Введи запрос");const q=encodeURIComponent(v.trim());
  return `<h3>Каталоги</h3>`+links([["TGStat","https://tgstat.ru/search?q="+q],["Telemetr","https://telemetr.me/search?q="+q],["Lyzem","https://lyzem.com/search?q="+q],["Google site:t.me","https://www.google.com/search?q=site%3At.me+"+q]]);
}},
{c:"nick",n:"Скан по платформам",d:"30 сервисов: занят ли никнейм",p:"nickname",f:async v=>{
  const u=norm(v);if(!u)throw new Error("Введи никнейм");
  const it=PLAT.map(([n,t],i)=>`<label class="frow" for="p${i}"><input type="checkbox" id="p${i}" checked data-u="${esc(t.replace("{u}",encodeURIComponent(u)))}">${esc(n)}</label>`).join("");
  return `<h3>Платформы</h3><div class="grp">${it}</div><button class="b2" id="op">Открыть отмеченные</button><button class="b2" id="op5">Первые 5</button><button class="b2" id="tgl">Снять все</button>`;
},after:()=>{
  const checked=()=>[...document.querySelectorAll("#o input:checked")].map(c=>c.dataset.u);
  const go=a=>a.forEach((u,k)=>setTimeout(()=>tg?.openLink?tg.openLink(u):window.open(u,"_blank"),k*250));
  $("#op").onclick=()=>go(checked());
  $("#op5").onclick=()=>go(checked().slice(0,5));
  $("#tgl").onclick=e=>{const boxes=[...document.querySelectorAll("#o .frow input")];const any=boxes.some(b=>b.checked);boxes.forEach(b=>b.checked=!any);e.target.textContent=any?"Выбрать все":"Снять все"};
}},
{c:"nick",n:"Вариации никнейма",d:"Мутации и производные формы",p:"nickname",f:async v=>{
  const u=norm(v).toLowerCase();if(!u)throw new Error("Введи никнейм");
  const o=new Set([u,u.replace(/[._-]/g,""),u+"1",u+"_",u+"99","real"+u,u+"official","the"+u,u.replace(/o/g,"0").replace(/i/g,"1"),u+"_dev",u+"_ru"]);["x","dev","pro","me"].forEach(s=>o.add(u+"_"+s));
  const r=[...o].join("\n");return `<div class="pre">${esc(r)}</div>`+cpb(r);
}},
{c:"email",n:"Проверка email",d:"Синтаксис, MX, Gravatar",p:"name@example.com",f:async v=>{
  const e=v.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e))throw new Error("Это не похоже на email. Пример: name@example.com");
  const d=e.split("@")[1];let mx="—",mc="";
  try{const j=await doh(d,"MX");const a=(j.Answer||[]).filter(r=>r.type===15);if(a.length){mx=a.map(r=>r.data.split(" ").pop()).join("\n");mc="ok"}else{mx="нет MX";mc="er"}}catch(x){mx="не удалось проверить"}
  const h=md5(e);
  return rows([["email",esc(e)],["домен",esc(d)],["MX",esc(mx),mc],["MD5",esc(h)]])
  +`<h3>Gravatar</h3><img class="thumb" alt="" src="https://www.gravatar.com/avatar/${h}?d=404&s=160" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'pre',textContent:'Аватар не найден'}))">`
  +`<h3>Дальше</h3>`+links([["Have I Been Pwned","https://haveibeenpwned.com/account/"+encodeURIComponent(e)],["Google",'https://www.google.com/search?q=%22'+encodeURIComponent(e)+'%22']]);
}},
{c:"phone",n:"Инфо по номеру",d:"Страна по коду, E.164, мессенджеры",p:"+7 999 123-45-67",f:async v=>{
  const d=v.replace(/[^\d]/g,"");if(!d)throw new Error("Введи номер");
  const cc=CC.filter(([c])=>d.startsWith(c)).sort((a,b)=>b[0].length-a[0].length)[0];
  return rows([["код","+"+(cc?cc[0]:"?")],["регион",esc(cc?cc[1]:"не определён")],["E.164","+"+d]])
  +`<h3>Мессенджеры</h3>`+links([["Telegram","https://t.me/+"+d],["WhatsApp","https://wa.me/"+d],["Google",'https://www.google.com/search?q=%22%2B'+d+'%22']]);
}},
{c:"dom",n:"DNS-записи",d:"A, AAAA, MX, NS, TXT",p:"example.com",f:async v=>{
  const d=v.trim().replace(/^https?:\/\//,"").split("/")[0];if(!d.includes("."))throw new Error("Нужен домен. Пример: example.com");
  const res=await Promise.all([["A",1],["AAAA",28],["MX",15],["NS",2],["TXT",16]].map(async([t,c])=>{
    try{const j=await doh(d,t);return [t,(j.Answer||[]).filter(r=>r.type===c).map(r=>r.data)]}catch(x){return [t,null]}
  }));
  const body=res.map(([t,a])=>`<div class="row"><div class="k">${t}</div><div class="v ${a&&a.length?'ok':''}">${a===null?'ошибка':a.length?esc(a.join("\n")):'—'}</div></div>`).join("");
  return `<h3>${esc(d)}</h3><div class="grp">${body}</div>`;
}},
{c:"dom",n:"Почтовая гигиена",d:"SPF и DMARC домена",p:"example.com",f:async v=>{
  const d=v.trim().replace(/^https?:\/\//,"").split("/")[0];if(!d.includes("."))throw new Error("Нужен домен. Пример: example.com");
  const g=async(n,t)=>{try{const j=await doh(n,t);return (j.Answer||[]).map(r=>r.data).join(" | ")}catch(e){return ""}};
  const [spf,dm]=await Promise.all([g(d,"TXT"),g("_dmarc."+d,"TXT")]);
  const hasS=/v=spf1/.test(spf);
  return rows([["SPF",hasS?"есть":"нет",hasS?"ok":"er"],["DMARC",dm?"есть":"нет",dm?"ok":"er"],["политика DMARC",(dm.match(/p=(none|quarantine|reject)/)||[,"нет"])[1]]]);
}},
{c:"dom",n:"WHOIS домена",d:"Регистратор, даты, статус (RDAP)",p:"example.com",f:async v=>{
  const d=v.trim().replace(/^https?:\/\//,"").split("/")[0].toLowerCase();if(!d.includes("."))throw new Error("Нужен домен. Пример: example.com");
  const r=await fetch("https://rdap.org/domain/"+encodeURIComponent(d));
  if(r.status===404)throw new Error("Домен не найден в RDAP. Возможно, он не зарегистрирован");
  if(!r.ok)throw new Error("RDAP вернул ошибку "+r.status);
  const j=await r.json();
  const ev=a=>{const e=(j.events||[]).find(x=>x.eventAction===a);return e?new Date(e.eventDate).toLocaleDateString("ru-RU"):"—"};
  const ent=(j.entities||[]).find(e=>(e.roles||[]).includes("registrar"));
  const fn=ent&&ent.vcardArray?(ent.vcardArray[1].find(x=>x[0]==="fn")||[])[3]:null;
  return rows([["домен",esc(j.ldhName||d)],["регистратор",esc(fn||"—")],["создан",esc(ev("registration"))],["изменён",esc(ev("last changed"))],["истекает",esc(ev("expiration"))],["статус",esc((j.status||[]).join("\n")||"—")],["NS",esc((j.nameservers||[]).map(n=>String(n.ldhName).toLowerCase()).join("\n")||"—")]])
  +`<h3>Дальше</h3>`+links([["Полный ответ RDAP","https://rdap.org/domain/"+encodeURIComponent(d)],["DomainTools","https://whois.domaintools.com/"+encodeURIComponent(d)]]);
}},
{c:"dom",n:"Архив и история",d:"Wayback, поддомены, кеш",p:"example.com/page",f:async v=>{
  const u=v.trim();if(!u)throw new Error("Введи адрес сайта");
  const full=u.startsWith("http")?u:"https://"+u;const host=full.replace(/^https?:\/\//,"").split("/")[0];
  let a="—";try{const r=await fetch("https://archive.org/wayback/available?url="+encodeURIComponent(full));const j=await r.json();a=(j.archived_snapshots&&j.archived_snapshots.closest)?j.archived_snapshots.closest.url:"снимков нет"}catch(e){a="не удалось проверить"}
  return rows([["снимок",a.includes("http")?`<a href="${esc(a)}" target="_blank" rel="noopener" style="color:var(--acc)">открыть</a>`:esc(a)]])
  +`<h3>Ещё</h3>`+links([["Все снимки","https://web.archive.org/web/*/"+full],["Поддомены (crt.sh)","https://crt.sh/?q=%25."+host],["Google site:","https://www.google.com/search?q=site%3A"+host]]);
}},
{c:"ip",n:"Инфо по IP",d:"Гео, провайдер, ASN",p:"8.8.8.8",f:async v=>{
  const ip=v.trim();if(!ip)throw new Error("Введи IP-адрес");
  const j=await (await fetch("https://ipwho.is/"+encodeURIComponent(ip))).json();
  if(!j.success)throw new Error("IP-адрес не распознан");
  return rows([["IP",esc(j.ip)],["тип",esc(j.type||"—")],["страна",esc(j.country||"—")],["город",esc(j.city||"—")],["провайдер",esc((j.connection&&j.connection.isp)||"—")],["ASN",esc((j.connection&&j.connection.asn)||"—")]])
  +`<h3>Дальше</h3>`+links([["Карта","https://www.google.com/maps?q="+j.latitude+","+j.longitude],["Shodan","https://www.shodan.io/host/"+encodeURIComponent(j.ip)]]);
}},
{c:"geo",n:"Координаты",d:"Decimal и DMS, карты",p:"55.7558, 37.6173",f:async v=>{
  const m=v.replace(/,/g," ").split(/\s+/).filter(Boolean);if(m.length<2)throw new Error("Нужны две координаты через запятую");
  const la=+m[0],lo=+m[1];if(isNaN(la)||isNaN(lo))throw new Error("Координаты должны быть числами");
  const dms=(x,p,n)=>{const a=Math.abs(x),d=Math.floor(a),mi=Math.floor((a-d)*60),s=((a-d)*60-mi)*60;return `${d}°${mi}'${s.toFixed(1)}"${x>=0?p:n}`};
  return rows([["decimal",esc(la+", "+lo)],["DMS",esc(dms(la,"N","S")+" "+dms(lo,"E","W"))]])
  +`<h3>Карты</h3>`+links([["Google","https://www.google.com/maps?q="+la+","+lo],["Яндекс","https://yandex.ru/maps/?pt="+lo+","+la+"&z=17"],["OpenStreetMap","https://www.openstreetmap.org/?mlat="+la+"&mlon="+lo]]);
}},
{c:"code",n:"Base64",d:"Кодирование и декодирование",p:"текст",f:async v=>{
  if(!v)throw new Error("Введи текст");
  let e=btoa(unescape(encodeURIComponent(v))),d="";
  try{d=decodeURIComponent(escape(atob(v.trim())))}catch(x){d="—"}
  return rows([["base64",esc(e)],["декодировано",esc(d)]])+cpb(e);
}},
{c:"code",n:"Разбор JWT",d:"Header и payload токена",p:"eyJhbGciOi...",f:async v=>{
  const p=v.trim().split(".");if(p.length<2)throw new Error("Это не JWT: нужны части через точку");
  const dec=s=>JSON.stringify(JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))))),null,2);
  return `<h3>Header</h3><div class="pre">${esc(dec(p[0]))}</div><h3>Payload</h3><div class="pre">${esc(dec(p[1]))}</div>`;
}},
{c:"util",n:"Хеши текста",d:"MD5, SHA-1, SHA-256, SHA-512",p:"текст",f:async v=>{
  if(!v)throw new Error("Введи текст");
  const [a,b,c]=await Promise.all([sha("SHA-1",v),sha("SHA-256",v),sha("SHA-512",v)]);
  return rows([["MD5",esc(md5(v))],["SHA-1",esc(a)],["SHA-256",esc(b)],["SHA-512",esc(c)]])+cpb(b);
}},
{c:"util",n:"Timestamp",d:"Unix и дата",p:"1712345678 или 2024-04-05",f:async v=>{
  const s=v.trim();if(!s)throw new Error("Введи значение");
  const d=/^\d+$/.test(s)?new Date(s.length>10?+s:+s*1000):new Date(s);
  if(isNaN(d))throw new Error("Не удалось распознать дату");
  return rows([["unix, сек",esc(Math.floor(d/1000))],["ISO",esc(d.toISOString())],["локально",esc(d.toLocaleString("ru-RU"))]]);
}},
{c:"util",n:"Генераторы",d:"UUID и пароль",p:null,f:async()=>{
  const pw=n=>{const a="abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*";return Array.from(crypto.getRandomValues(new Uint32Array(n))).map(x=>a[x%a.length]).join("")};
  const u=crypto.randomUUID();
  return rows([["uuid",esc(u)],["пароль, 20 символов",esc(pw(20))]])+cpb(u);
}},
{c:"util",n:"Google dorks",d:"Готовые поисковые запросы",p:"домен",f:async v=>{
  const q=v.trim();if(!q)throw new Error("Введи домен или слово");
  const g=s=>"https://www.google.com/search?q="+encodeURIComponent(s);
  return links([["Документы PDF",g("site:"+q+" filetype:pdf")],["Таблицы XLSX",g("site:"+q+" filetype:xlsx")],["Страницы входа",g("site:"+q+" inurl:login")],["Открытые каталоги",g("site:"+q+' intitle:"index of"')],["Файлы .env",g("site:"+q+" filetype:env")]]);
}}
];

const CATS=[["all","Все"],["tg","Телеграм"],["nick","Никнеймы"],["email","Email"],["phone","Телефон"],["dom","Домен"],["ip","IP"],["geo","Гео"],["code","Кодирование"],["util","Утилиты"]];
const CATNAME=Object.fromEntries(CATS);
const byName = n => T.findIndex(t=>t.n===n);

/* ---------- распознавание введённых данных ---------- */
function detect(v){
  v=v.trim(); if(!v) return null;
  if(/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v)) return ["на email","Проверка email"];
  if(/^eyJ[\w-]+\.[\w-]+/.test(v)) return ["на JWT-токен","Разбор JWT"];
  if(/^(\d{1,3}\.){3}\d{1,3}$/.test(v) || (/^[0-9a-f:]{3,39}$/i.test(v) && (v.match(/:/g)||[]).length>=2)) return ["на IP-адрес","Инфо по IP"];
  if(/^-?\d{1,3}(\.\d+)?\s*[, ]\s*-?\d{1,3}(\.\d+)?$/.test(v)) return ["на координаты","Координаты"];
  if(/^\+[\d\s()-]{7,}$/.test(v)) return ["на номер телефона","Инфо по номеру"];
  if(/^\d{10}$|^\d{13}$/.test(v)) return ["на Unix-время","Timestamp"];
  if(/^[\d\s()-]{10,}$/.test(v)) return ["на номер телефона","Инфо по номеру"];
  if(/^@\w{3,}$/.test(v)) return ["на юзернейм","Профиль Телеграм"];
  if(/^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(v)) return ["на домен","DNS-записи"];
  return null;
}

/* ---------- список ---------- */
let cat="all";
function drawChips(){ $("#chips").innerHTML = CATS.map(([k,n])=>`<button class="chip ${k===cat?'on':''}" data-c="${k}">${n}</button>`).join(""); }

const itemHtml=(t,i)=>`<button class="item" data-i="${i}"><div class="ico" style="--h:${HUE[t.c]}">${I[t.c]}</div><div class="tx"><div class="cn">${esc(t.n)}</div><div class="cd">${esc(t.d)}</div></div>${I.chev}</button>`;

function drawList(){
  const raw=$("#q").value, q=raw.toLowerCase().trim(), det=detect(raw);
  $("#sgw").innerHTML = det ? `<button class="sg" id="sg"><div><b>Похоже на ${esc(det[0])}</b><span>Открыть «${esc(det[1])}» и проверить</span></div>${I.chev.replace('class="chev"','')}</button>` : "";
  if(det) $("#sg").onclick=()=>{ hap(); openTool(byName(det[1]), raw.trim()); };

  let html="";
  if(cat==="all" && !q){
    const fv=favs.map(byName).filter(i=>i>=0);
    if(fv.length) html+=`<div class="gh">Избранное</div><div class="grp">`+fv.map(i=>itemHtml(T[i],i)).join("")+`</div>`;
    const hv=hist.map((h,k)=>[h,k,byName(h.n)]).filter(x=>x[2]>=0);
    if(hv.length) html+=`<div class="gh">Недавние проверки<button class="clr" id="clh">Очистить</button></div><div class="grp">`+hv.map(([h,k,i])=>
      `<button class="item" data-h="${k}"><div class="ico" style="--h:${HUE[T[i].c]}">${I[T[i].c]}</div><div class="tx"><div class="cn hv">${esc(h.v||h.n)}</div><div class="cd">${esc(h.n)}</div></div>${I.chev}</button>`).join("")+`</div>`;
  }
  for(const [k] of CATS.slice(1)){
    if(cat!=="all" && cat!==k) continue;
    const items=T.map((t,i)=>[t,i]).filter(([t])=>t.c===k && (det || !q || (t.n+" "+t.d).toLowerCase().includes(q)));
    if(!items.length) continue;
    html+=`<div class="gh">${CATNAME[k]}</div><div class="grp">`+items.map(([t,i])=>itemHtml(t,i)).join("")+`</div>`;
  }
  $("#grid").innerHTML = html || '<div class="empty">Ничего не найдено. Попробуй другое слово.</div>';
}

/* ---------- экран инструмента (функции переименованы, чтобы не затирать window.open и window.close) ---------- */
function openTool(i, preset){
  const t=T[i]; if(!t) return;
  $("#list").classList.add("hide"); $("#tool").classList.remove("hide");
  tg?.BackButton?.show();
  $("#tool").innerHTML = `<button class="back" id="bk">${I.back}Назад</button>
  <div class="th"><div class="ico" style="--h:${HUE[t.c]}">${I[t.c]}</div><div><h2>${esc(t.n)}</h2><p>${esc(t.d)}</p></div><button class="star ${favs.includes(t.n)?'on':''}" id="st" aria-label="В избранное">${I.star}</button></div>
  ${t.p?`<label class="lb" for="in">Что проверить</label><input class="f" id="in" placeholder="${esc(t.p)}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">`:""}
  <button class="run" id="rn">${t.p?"Проверить":"Сгенерировать"}</button><div class="out" id="o"></div>`;
  $("#bk").onclick = closeTool;
  $("#st").onclick = () => {
    hap();
    favs = favs.includes(t.n) ? favs.filter(x=>x!==t.n) : [...favs,t.n];
    store.set("osint_fav",favs);
    $("#st").classList.toggle("on",favs.includes(t.n));
  };
  const run = async () => {
    hap();
    const o=$("#o"), btn=$("#rn"); btn.disabled=true;
    o.innerHTML='<div class="pre"><span class="sp"></span>Выполняю…</div>';
    try{
      o.innerHTML = await t.f(t.p?$("#in").value:"");
      t.after?.();
      if(t.p && t.c!=="code" && t.n!=="Хеши текста"){
        const val=$("#in").value.trim();
        hist=[{n:t.n,v:val},...hist.filter(x=>!(x.n===t.n&&x.v===val))].slice(0,8);
        store.set("osint_hist",hist);
      }
      o.insertAdjacentHTML("beforeend",'<button class="b2" id="cpall">Скопировать результат</button>');
      $("#cpall").onclick=ev=>{
        const b=ev.currentTarget;
        const text=[...o.childNodes].filter(n=>n.id!=="cpall").map(n=>n.innerText||n.textContent).join("\n").trim();
        navigator.clipboard.writeText(text).then(()=>{b.textContent="Скопировано";setTimeout(()=>b.textContent="Скопировать результат",1200)}).catch(()=>{});
      };
    }catch(e){ o.innerHTML=`<div class="err">${esc(e.message||"Ошибка")}</div>`; }
    btn.disabled=false;
  };
  $("#rn").onclick = run;
  if(t.p){
    $("#in").onkeydown = e => { if(e.key==="Enter") run(); };
    if(preset){ $("#in").value=preset; run(); } else $("#in").focus();
  } else run();
  window.scrollTo(0,0);
}
function closeTool(){
  $("#tool").classList.add("hide"); $("#list").classList.remove("hide");
  $("#tool").innerHTML=""; tg?.BackButton?.hide();
}

tg?.BackButton?.onClick(closeTool);
$("#chips").onclick = e => { const b=e.target.closest("[data-c]"); if(!b)return; hap(); cat=b.dataset.c; drawChips(); drawList(); };
$("#grid").onclick = e => {
  if(e.target.closest("#clh")){ hist=[]; store.set("osint_hist",hist); drawList(); return; }
  const h=e.target.closest("[data-h]");
  if(h){ hap(); const x=hist[+h.dataset.h]; if(x) openTool(byName(x.n), x.v); return; }
  const c=e.target.closest("[data-i]"); if(c){ hap(); openTool(+c.dataset.i); }
};
$("#q").oninput = drawList;
document.addEventListener("click", e => {
  const b=e.target.closest("[data-copy]");
  if(b){ navigator.clipboard.writeText(b.dataset.copy).then(()=>{const t=b.textContent;b.textContent="Скопировано";setTimeout(()=>b.textContent=t,1200)}).catch(()=>{}) }
});
drawChips(); drawList();
</script>
</body>
