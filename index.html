<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OSINT Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#17212b;--fg:#f5f5f5;--mut:#8b9aa8;--card:#1c2733;--bd:#26333f;
    --acc:#2aabee;--inp:#1c2733;--sec:#222f3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px 14px 28px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .top-left{display:flex;align-items:center;gap:10px}
  .balance-badge{font-size:12px;background:var(--sec);border:1px solid var(--bd);padding:5px 10px;border-radius:12px;color:var(--acc);font-weight:500}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:0 0 34px}
  .logo svg{width:19px;height:19px}
  .tt{font-weight:500;font-size:15px}
  .ss{font-size:11px;color:var(--mut)}
  .srch{display:flex;align-items:center;gap:8px;background:var(--inp);border:1px solid var(--bd);border-radius:11px;padding:0 10px;height:40px}
  .srch input{flex:1;background:none;border:0;outline:0;color:var(--fg);font-size:14px;font-family:inherit;min-width:0}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{background:var(--sec);color:var(--fg);border:1px solid transparent;border-radius:20px;padding:5px 11px;font-size:12px;white-space:nowrap;font-family:inherit;cursor:pointer}
  .chip.on{background:var(--acc);color:#fff}
  .note{font-size:11.5px;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin:10px 0 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px;text-align:left;font-family:inherit;color:var(--fg);cursor:pointer;display:flex;gap:9px;align-items:flex-start}
  .card:active{background:var(--sec)}
  .ico{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--sec);color:var(--acc);display:grid;place-items:center}
  .ico svg{width:15px;height:15px}
  .cn{font-size:12.5px;font-weight:500;margin-bottom:2px}
  .cd{font-size:10.5px;color:var(--mut);line-height:1.3}
  .hide{display:none!important}
  .back{display:flex;align-items:center;gap:5px;background:none;border:0;color:var(--acc);font-size:13px;font-family:inherit;padding:6px 0;margin-bottom:6px;cursor:pointer}
  .back svg{width:15px;height:15px}
  h1{font-size:16px;font-weight:500;margin:0 0 3px}
  .dsc{font-size:12px;color:var(--mut);margin:0 0 12px}
  label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px}
  input.f,textarea{width:100%;background:var(--inp);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--fg);font-size:14px;font-family:inherit;outline:0}
  input.f:focus{border-color:var(--acc)}
  .run{width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:500;font-family:inherit;margin-top:12px;cursor:pointer}
  .run:disabled{opacity:.5}
  .out{margin-top:12px}
  h3{font-size:11px;color:var(--mut);font-weight:400;margin:14px 0 6px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;background:var(--card);border-bottom:1px solid var(--bd);font-size:12.5px}
  .row:last-child{border-bottom:0;border-radius:0 0 9px 9px}
  .row:first-child{border-radius:9px 9px 0 0}
  .k{color:var(--mut);flex:0 0 auto}
  .v{text-align:right;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
  .ok{color:#4fae4e}.er{color:#e05252}
  .pre{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-all}
  .ll a{display:flex;justify-content:space-between;padding:9px 10px;background:var(--card);border-bottom:1px solid var(--bd);color:var(--fg);text-decoration:none;font-size:12.5px}
  .ll a:first-child{border-radius:9px 9px 0 0}
  .ll a:last-child{border-bottom:0;border-radius:0 0 9px 9px}
  .ll a span{color:var(--mut);font-size:11px}
  .b2{background:var(--sec);color:var(--fg);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;font-size:12.5px;font-family:inherit;margin-top:10px;cursor:pointer}
  .err{background:#3a1f1f;border:1px solid #e05252;border-radius:9px;padding:9px 11px;font-size:12px}
  .sp{display:inline-block;width:12px;height:12px;border:2px solid var(--mut);border-top-color:var(--acc);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top">
  <div class="top-left">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></div>
    <div><div class="tt">OSINT Hub</div><div class="ss" id="user-info">Загрузка...</div></div>
  </div>
  <div class="balance-badge" id="balance">-- кр.</div>
</div>

<div id="list">
  <div class="srch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg><input id="q" placeholder="Поиск инструмента"></div>
  <div class="chips" id="chips"></div>
  <div class="note">Инструменты бэкенда списывают кредиты с баланса при выполнении.</div>
  <div class="grid" id="grid"></div>
</div>

<div id="tool" class="hide"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.("secondary_bg_color"); }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I = {
  tg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 4 3 11l5 2 2 6 3-4 5 3z"/></svg>',
  nick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>',
  email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  dom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>',
  ip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>',
  util:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.5 6.5a4 4 0 1 0 5 5L21 17v3h-3l-5.5-5.5a4 4 0 0 0-5-5z"/></svg>'
};

// Базовый URL вашего туннеля с ПК
const API_BASE = 'https://appearing-theories-sword-bristol.trycloudflare.com';

async function apiFetch(tool, value) {
  const res = await fetch(`${API_BASE}/api/lookup`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Init-Data': tg?.initData || ''
    },
    body: JSON.stringify({ tool, value })
  });
  if (res.status === 401) throw new Error('Ошибка авторизации через Telegram');
  if (res.status === 402) throw new Error('Недостаточно кредитов. Пополните баланс в боте (/buy)');
  if (res.status === 429) throw new Error('Слишком много запросов. Подождите');
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || 'Ошибка сервера');
  }
  return await res.json();
}

async function loadMe() {
  try {
    const res = await fetch(`${API_BASE}/api/me`, {
      headers: { 'X-Init-Data': tg?.initData || '' }
    });
    if (res.ok) {
      const data = await res.json();
      $("#balance").textContent = data.balance + " кр.";
      $("#user-info").textContent = "ID: " + data.id;
    }
  } catch(e) {
    $("#user-info").textContent = "offline mode";
  }
}

const T=[
  {c:"ip",n:"IP Info & Hudson Rock",d:"Анализ IP, геолокация и поиск стиллеров",i:"ip",p:"8.8.8.8",cost:1,type:"sync",tool:"ip_info"},
  {c:"dom",n:"DNS Records",d:"Полный сбор DNS записей (A, MX, TXT и др.)",i:"dom",p:"example.com",cost:1,type:"sync",tool:"dns"},
  {c:"util",n:"MAC Vendor Lookup",d:"Определение производителя сетевой карты по MAC",i:"util",p:"00:11:22:33:44:55",cost:1,type:"sync",tool:"mac_vendor"},
  {c:"util",n:"ProxyNova Comb Search",d:"Поиск по базам прокси / комбо",i:"util",p:"query",cost:2,type:"sync",tool:"proxy_comb"},
  {c:"util",n:"Blockchain Address Parser",d:"Проверка баланса и транзакций BTC",i:"util",p:"1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa",cost:2,type:"sync",tool:"blockchain"},
  {c:"phone",n:"Мессенджеры по номеру",d:"Быстрые ссылки на WA, Telegram, OK",i:"phone",p:"+79991234567",cost:1,type:"sync",tool:"phone_check"},
  {c:"nick",n:"Проверка профилей (Соцсети)",d:"Поиск аккаунтов в TikTok, Roblox и др.",i:"nick",p:"username",cost:2,type:"sync",tool:"social_scan"},
  {c:"tg",n:"Telegram Resolve (Heavy)",d:"Глубокий сбор данных пользователя/канала",i:"tg",p:"username",cost:3,type:"heavy",tool:"tg_resolve"}
];

const CATS=[["all","Все"],["ip","IP / Сети"],["dom","Домены"],["util","Кастомные"],["phone","Телефон"],["nick","Соцсети"],["tg","Telegram"]];
let cat="all";

function drawChips(){ $("#chips").innerHTML = CATS.map(([k,n])=>`<button class="chip ${k===cat?'on':''}" data-c="${k}">${n}</button>`).join(""); }
function drawList(){
  const q=$("#q").value.toLowerCase();
  let l=T.filter(t=>(cat==="all"||t.c===cat)&&(!q||(t.n+t.d).toLowerCase().includes(q)));
  $("#grid").innerHTML = l.map((t)=>`<button class="card" data-i="${T.indexOf(t)}"><div class="ico">${I[t.i]}</div><div><div class="cn">${esc(t.n)} (${t.cost} кр.)</div><div class="cd">${esc(t.d)}</div></div></button>`).join("") || '<div style="grid-column:1/-1;text-align:center;color:var(--mut);padding:24px 0;font-size:13px">Ничего не найдено</div>';
}

function open(i){
  const t=T[i];
  $("#list").classList.add("hide"); $("#tool").classList.remove("hide");
  tg?.BackButton?.show(); tg?.BackButton?.onClick(close);
  $("#tool").innerHTML = `<button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>Назад</button>
  <h1>${esc(t.n)}</h1><p class="dsc">${esc(t.d)} (Стоимость: ${t.cost} кредит.)</p>
  <label>входные данные</label><input class="f" id="in" placeholder="${esc(t.p)}">
  <button class="run" id="rn">Запустить</button><div class="out" id="o"></div>`;
  $("#bk").onclick = close;

  const run = async () => {
    const val = $("#in").value.trim();
    if(!val) { alert("Введите значение"); return; }
    const o=$("#o"); 
    o.innerHTML='<div class="pre"><span class="sp"></span>Выполняется запрос...</div>';
    $("#rn").disabled = true;

    try {
      const resp = await apiFetch(t.tool, val);
      loadMe();

      if (resp.result) {
        o.innerHTML=`<div class="pre">${esc(JSON.stringify(resp.result, null, 2))}</div>`;
      } else if (resp.job) {
        o.innerHTML=`<div class="pre"><span class="sp"></span>Задача поставлена в очередь (ID: ${resp.job}). Ожидание...</div>`;
        pollJob(resp.job, o);
        return;
      } else {
        o.innerHTML=`<div class="pre">${esc(JSON.stringify(resp, null, 2))}</div>`;
      }
    } catch(e) {
      o.innerHTML=`<div class="err">${esc(e.message||"Ошибка")}</div>`;
    }
    $("#rn").disabled = false;
  };

  $("#rn").onclick = run;
  $("#in").focus();
  window.scrollTo(0,0);
}

async function pollJob(jobId, container) {
  const interval = setInterval(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/job/${jobId}`, {
        headers: { 'X-Init-Data': tg?.initData || '' }
      });
      if (!res.ok) return;
      const data = await res.json();

      if (data.status === 'done') {
        clearInterval(interval);
        const parsed = typeof data.result === 'string' ? JSON.parse(data.result) : data.result;
        container.innerHTML=`<div class="pre">Готово!\n\n${esc(JSON.stringify(parsed, null, 2))}</div>`;
        $("#rn").disabled = false;
      } else if (data.status === 'error') {
        clearInterval(interval);
        container.innerHTML=`<div class="err">Ошибка воркера: ${esc(data.result)}</div>`;
        $("#rn").disabled = false;
      }
    } catch(err) {
      clearInterval(interval);
      container.innerHTML=`<div class="err">Ошибка соединения при опросе задачи</div>`;
      $("#rn").disabled = false;
    }
  }, 2000);
}

function close(){
  $("#tool").classList.add("hide"); $("#list").classList.remove("hide");
  $("#tool").innerHTML=""; tg?.BackButton?.hide();
  loadMe();
}

$("#chips").onclick = e => { const b=e.target.closest("[data-c]"); if(!b)return; cat=b.dataset.c; drawChips(); drawList(); };
$("#grid").onclick = e => { const c=e.target.closest("[data-i]"); if(c) open(+c.dataset.i); };
$("#q").oninput = drawList;

drawChips(); drawList();
loadMe();
</script>
</body>
</html>
