<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OSINT Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0d1218; --s1:#151c25; --s2:#1d2632; --line:rgba(255,255,255,.07);
    --fg:#eef2f6; --mut:#8593a3; --acc:#3aa8f0; --acc-fg:#05131f;
    --ok:#5ccf8b; --er:#ff7a7a; --errbg:rgba(255,122,122,.12); --gold:#f2c14e;
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg:#f1f4f8; --s1:#ffffff; --s2:#e8edf3; --line:rgba(0,0,0,.08);
    --fg:#0f161d; --mut:#627083; --acc:#1b8fd8; --acc-fg:#ffffff;
    --ok:#1d9a55; --er:#d23d3d; --errbg:rgba(210,61,61,.10); --gold:#9a6600;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    padding:0 16px calc(36px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0 0 auto 0;height:260px;pointer-events:none;z-index:-1;
    background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 65%);
  }
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .hide{display:none!important}

  .head{padding:22px 2px 14px}
  .head h1{margin:0;font-size:30px;line-height:1.1;font-weight:750;letter-spacing:-.02em}
  .head p{margin:6px 0 0;color:var(--mut);font-size:14px}

  .bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px 6px;background:linear-gradient(var(--bg) 80%,transparent)}
  .srch{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:52px;transition:border-color .15s,box-shadow .15s}
  .srch:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
  .srch svg{width:20px;height:20px;flex:0 0 20px;color:var(--mut)}
  .srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:16px}
  .srch input::placeholder{color:var(--mut)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin:0 -16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--mut);cursor:pointer;transition:background .15s,color .15s}
  .chip.on{background:var(--fg);color:var(--bg);border-color:transparent}

  .sg{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;text-align:left;cursor:pointer;
      background:color-mix(in srgb,var(--acc) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:16px}
  .sg b{display:block;font-size:14.5px;font-weight:650}
  .sg span{display:block;font-size:13px;color:var(--mut)}
  .sg svg{width:18px;height:18px;flex:0 0 18px;margin-left:auto;color:var(--acc)}

  .note{font-size:13px;color:var(--mut);margin:14px 4px 0}

  .gh{font-size:13.5px;font-weight:600;color:var(--mut);margin:22px 4px 8px}
  .grp{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
  .item:last-child{border-bottom:0}
  .item:active{background:var(--s2)}
  .ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;
       background:var(--s2);background:color-mix(in srgb,var(--h) 17%,transparent);color:var(--h)}
  .ico svg{width:20px;height:20px}
  .tx{flex:1;min-width:0}
  .cn{font-size:15px;font-weight:600;line-height:1.25}
  .cd{font-size:12.5px;color:var(--mut);line-height:1.3;margin-top:1px}
  .chev{width:16px;height:16px;flex:0 0 16px;color:var(--mut);opacity:.6}
  .empty{text-align:center;color:var(--mut);padding:40px 0;font-size:14px}

  #tool{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--acc);font-size:15px;font-weight:500;padding:14px 0 6px;cursor:pointer}
  .back svg{width:18px;height:18px}
  .th{display:flex;align-items:center;gap:13px;margin:8px 0 18px}
  .th .ico{width:46px;height:46px;flex-basis:46px;border-radius:14px}
  .th .ico svg{width:24px;height:24px}
  .th h2{margin:0;font-size:22px;line-height:1.15;font-weight:720;letter-spacing:-.01em}
  .th p{margin:3px 0 0;font-size:13.5px;color:var(--mut)}
  label.lb{display:block;font-size:13px;color:var(--mut);margin:0 2px 7px}
  .f{display:block;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 15px;height:52px;color:var(--fg);font:inherit;font-size:16px;outline:0;transition:border-color .15s,box-shadow .15s}
  .f:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
  .run{width:100%;height:52px;margin-top:14px;background:var(--acc);color:var(--acc-fg);border:0;border-radius:14px;font-size:16px;font-weight:650;cursor:pointer;transition:transform .1s,opacity .15s}
  .run:active{transform:scale(.985)}
  .run:disabled{opacity:.5}
  .out{margin-top:20px}
  .out h3{font-size:13.5px;font-weight:600;color:var(--mut);margin:20px 4px 8px}
  .out h3:first-child{margin-top:0}

  .row{display:flex;justify-content:space-between;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .k{color:var(--mut);flex:0 0 auto}
  .v{text-align:right;white-space:pre-line;word-break:break-all;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;user-select:text;-webkit-user-select:text}
  .ok{color:var(--ok)} .er{color:var(--er)}
  .pre{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
  .ll a{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:14.5px;font-weight:500}
  .ll a:last-child{border-bottom:0}
  .ll a:active{background:var(--s2)}
  .ll a span{color:var(--acc);font-size:13px;font-weight:500}
  .b2{background:var(--s1);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:14px;font-weight:550;margin:12px 8px 0 0;cursor:pointer}
  .b2:active{background:var(--s2)}
  .thumb{width:84px;height:84px;border-radius:16px;border:1px solid var(--line);object-fit:cover;display:block}
  .err{background:var(--errbg);border:1px solid color-mix(in srgb,var(--er) 45%,transparent);color:var(--er);border-radius:14px;padding:12px 14px;font-size:14px}
  .sp{display:inline-block;width:14px;height:14px;border:2px solid var(--mut);border-top-color:var(--acc);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes r{to{transform:rotate(360deg)}}
  .frow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
  .frow:last-child{border-bottom:0}
  .frow input{accent-color:var(--acc);width:19px;height:19px;margin:0}

  .star{margin-left:auto;background:none;border:0;padding:8px;color:var(--mut);cursor:pointer}
  .star svg{width:26px;height:26px}
  .star.on{color:#f2c14e}
  .star.on svg{fill:currentColor}
  .gh .clr{float:right;background:none;border:0;color:var(--acc);font-size:13px;font-weight:500;cursor:pointer;padding:0}
  .hv{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;word-break:break-all}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes sh{to{background-position:-200% 0}}
  .head h1{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
  .head p{animation:up .55s .08s cubic-bezier(.2,.7,.2,1) both}
  .anim .item,.anim .gh{animation:up .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n,0)*35ms)}
  .out .row,.out .ll a,.out .frow,.out .pre,.out .thumb,.out h3,.out .b2,.out .err{animation:up .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n,0)*40ms)}
  .item{transition:background .15s,transform .12s}
  .item:active{transform:scale(.985)}
  .chip:active{transform:scale(.95)}
  .chip{transition:background .2s,color .2s,transform .12s}
  .skl{height:16px;margin:14px;border-radius:8px;width:var(--w,80%);
       background:linear-gradient(90deg,var(--s2) 25%,color-mix(in srgb,var(--fg) 12%,var(--s2)) 50%,var(--s2) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}

  .f.ta{height:140px;padding:12px 15px;line-height:1.4;resize:vertical}
  .info{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 18px;font-size:13.5px;line-height:1.5;color:var(--mut)}
  .info b{color:var(--fg);font-weight:600}

  .wallet{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 0;padding:12px 14px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;cursor:pointer}
  .wallet .ico{--h:#f2c14e}
  .wallet .wt{flex:1;min-width:0}
  .wallet b{font-size:16px;font-weight:650}
  .wallet .wt span{display:block;font-size:12.5px;color:var(--mut)}
  .wb{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--s2);font-size:13.5px;font-weight:600}
  .wb.hot{background:var(--acc);color:var(--acc-fg)}
  .vz{display:flex;gap:13px;align-items:flex-start;width:100%;margin-top:10px;padding:14px;text-align:left;cursor:pointer;border-radius:18px;position:relative;
      border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--h) 35%,var(--line));
      background:var(--s1);background:linear-gradient(135deg,color-mix(in srgb,var(--h) 16%,var(--s1)),var(--s1) 65%);transition:transform .12s}
  .vz:active{transform:scale(.985)}
  .vd{font-size:13px;color:var(--mut);line-height:1.4;margin-top:6px}
  .pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--s2);color:var(--fg)}
  .pill svg{width:13px;height:13px}
  .pill.gold{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
  .pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
  #shade{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgba(0,0,0,.55);animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.7,.2,1)}
  .sheet h2{margin:0;font-size:22px;font-weight:720;letter-spacing:-.01em}
  .sp1{margin:6px 0 16px;color:var(--mut);font-size:14px}
  .feat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:13.5px}
  .feat ul{margin:8px 0 0;padding-left:18px;color:var(--mut)}
  .feat li{margin:3px 0}
  .b2.wide{width:100%;margin:10px 0 0}
  .fine{font-size:12px;color:var(--mut);margin:14px 2px 0;line-height:1.45}
  .price{font-size:14px;font-weight:650;color:var(--gold);white-space:nowrap}
  .bal{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 14px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
  .bal b{font-size:18px}
  .bal span{font-size:12.5px;color:var(--mut);text-align:right}
  .cost{margin-top:8px;font-weight:600;color:var(--fg)}
  #viz{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  .vb{display:flex;align-items:center;gap:8px;padding:2px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;min-height:46px}
  .vb .back{padding:10px 6px}
  .vt{flex:1;min-width:0;text-align:center;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vbuy{background:var(--acc);color:var(--acc-fg);border:0;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:650;cursor:pointer;white-space:nowrap}
  .vbody{flex:1;min-height:0;position:relative}
  .vbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0c11}
  .vload{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .adm{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .adm .b2{margin:0}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="list">
  <div class="head">
    <h1>OSINT Hub</h1>
    <p>Проверки по открытым источникам</p>
  </div>
  <div id="wlt"></div>
  <div id="adw"></div>
  <div id="vzw"></div>
  <div class="bar">
    <div class="srch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="q" placeholder="Вставь email, IP, домен, ник или номер" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>
    <div id="sgw"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="note">DNS, IP, email и хеши проверяются прямо здесь. Остальные инструменты открывают внешние сервисы.</div>
  <div id="grid"></div>
</div>

<div id="tool" class="hide"></div>
<div id="viz" class="hide"></div>
<div id="shade" class="hide"></div>
<div id="toast" role="status"></div>

<script>
const tg = window.Telegram?.WebApp;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").trim().replace(/^@/,"");
const hap = () => { try{ tg?.HapticFeedback?.impactOccurred("light"); }catch(e){} };
const store = {
  get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
let favs = store.get("osint_fav",[]);
let hist = store.get("osint_hist",[]);
if(!Array.isArray(favs)) favs=[];
if(!Array.isArray(hist)) hist=[];

function applyTheme(){
  const dark = tg ? tg.colorScheme !== "light" : !matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try{ tg?.setHeaderColor?.(bg); tg?.setBackgroundColor?.(bg); tg?.setBottomBarColor?.(bg); }catch(e){}
}
if (tg) { tg.ready(); tg.expand(); tg.onEvent?.("themeChanged", applyTheme); }
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => { if(!tg) applyTheme(); });
applyTheme();

const I = {
  tg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M21 4 3 11l5 2 2 6 3-4 5 3z"/></svg>',
  nick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>',
  email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  dom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>',
  ip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7.5h.01M7 17h.01"/></svg>',
  geo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg>',
  util:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 6.5a4 4 0 1 0 5 5L21 17v3h-3l-5.5-5.5a4 4 0 0 0-5-5z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.9l-5.4 2.8 1.1-6.1L3.2 9.4l6.1-.8z"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  graph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M8.4 7.3 15.6 8M7.3 9.2l3.6 6.6M16.8 10.2l-3.6 5.6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>'

{c:"ip",n:"CIDR-калькулятор",d:"Диапазон адресов подсети",p:"192.168.1.0/24",f:async v=>{

  if(!m)throw new Error("Формат: 192.168.1.0/24 (только IPv4)");
  const o=m.slice(1,5).map(Number),p=+m[5];if(o.some(x=>x>255)||p>32)throw new Error("Неверный адрес или маска");
  const ip=((o[0]<<24)|(o[1]<<16)|(o[2]<<8)|o[3])>>>0;
  const mask=p===0?0:(0xFFFFFFFF<<(32-p))>>>0;
  const net=(ip&mask)>>>0,bc=(net|((~mask)>>>0))>>>0;
  const s=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");
  const tot=Math.pow(2,32-p);
  return rows([["сеть",s(net)],["маска",s(mask)],["обратная маска",s((~mask)>>>0)],["первый адрес",s(p>=31?net:net+1)],["последний адрес",s(p>=31?bc:bc-1)],["широковещательный",s(bc)],["всего адресов",String(tot)],["хостов",String(p>=31?tot:tot-2)]])
  +`<h3>Подробнее</h3>`+links([["Кому принадлежит сеть","https://bgp.he.net/net/"+s(net)+"/"+p]]);
}},

{c:"doc",n:"Проверка номеров",d:"ИНН, ОГРН, СНИЛС, КПП, карта, VIN",p:"вставь номер",f:async v=>{

  if(/^\d{15}$/.test(d)) out.push(["ОГРНИП",ogrnOk(d)]);

{c:"doc",n:"Генератор номеров",d:"Валидные ИНН, ОГРН, СНИЛС, карта, VIN",p:null,f:async()=>{
  const inn10=()=>{const b=rnd(9);return b+innC([...b].map(Number),[2,4,10,3,5,9,4,6,8])};
  const inn12=()=>{const a=rnd(10);const c11=innC([...a].map(Number),[7,2,4,10,3,5,9,4,6,8]);const b=a+c11;const c12=innC([...b].map(Number),[3,7,2,4,10,3,5,9,4,6,8]);return b+c12};
  const ogrn=()=>{const b=rnd(12);return b+String((BigInt(b)%11n)%10n)};
  const ogrnip=()=>{const b=rnd(14);return b+String((BigInt(b)%13n)%10n)};
  const snils=()=>{const b=rnd(9);const d=[...b].map(Number);let sum=0;for(let i=0;i<9;i++)sum+=d[i]*(9-i);let c=sum<100?sum:(sum===100||sum===101?0:sum%101);if(c===100||c===101)c=0;return b+String(c).padStart(2,"0")};
  const card=()=>luhnAdd("4276"+rnd(11));
  const vin=()=>{const A="ABCDEFGHJKLMNPRSTUVWXYZ0123456789";let s=Array.from(crypto.getRandomValues(new Uint32Array(17))).map(x=>A[x%A.length]).join("");let u=s.slice(0,8)+"0"+s.slice(9);let sum=0;for(let i=0;i<17;i++){const c=u[i];sum+=(/\d/.test(c)?+c:VM[c])*VW[i]}const r=sum%11;return u.slice(0,8)+(r===10?"X":String(r))+u.slice(9)};
  const list=[["ИНН 10 (организация)",inn10()],["ИНН 12 (человек)",inn12()],["ОГРН",ogrn()],["ОГРНИП",ogrnip()],["СНИЛС",snils()],["карта Visa",card()],["VIN",vin()]];
  const t=list.map(([n,x])=>n+": "+x).join("\n");
  return rows(list.map(([n,x])=>[n,esc(x)]))+cpb(t);
}},
{c:"code",n:"Base64",d:"Кодирование и декодирование",p:"текст",f:async v=>{

  return `<h3>Header</h3><div class="pre">${esc(dec(p[0]))}</div><h3>Payload</h3><div class="pre">${esc(dec(p[1]))}</div>`;

{c:"code",n:"Определить тип хеша",d:"MD5, SHA, bcrypt и другие по внешнему виду",p:"вставь хеш целиком",f:async v=>{
  const h=v.trim();if(!h)throw new Error("Вставь хеш");
  const hex=/^[a-f0-9]+$/i.test(h),L=h.length,t=[];
  if(/^\$2[abxy]\$\d\d\$.{53}$/.test(h))t.push("bcrypt");
  if(/^\$argon2(id|i|d)\$/.test(h))t.push("Argon2");
  if(/^\$6\$/.test(h))t.push("SHA-512 crypt (Linux)");else if(/^\$5\$/.test(h))t.push("SHA-256 crypt (Linux)");else if(/^\$1\$/.test(h))t.push("MD5 crypt (Linux)");
  if(/^\*[A-F0-9]{40}$/i.test(h))t.push("MySQL 4.1+");
  if(hex){const M={8:"CRC32 / Adler-32",16:"половина MD5 / MySQL 3.x",32:"MD5 / NTLM / MD4",40:"SHA-1 / RIPEMD-160",56:"SHA-224 / SHA3-224",64:"SHA-256 / SHA3-256 / BLAKE2s",96:"SHA-384",128:"SHA-512 / SHA3-512 / Whirlpool"};if(M[L])t.push(M[L])}
  if(!t.length)throw new Error("Формат не распознан. Проверь, что вставлен хеш целиком");
  return rows([["длина",String(L)],["символы",hex?"только hex":"не только hex"],["похоже на",esc(t.join("\n")),"ok"]])+`<div class="note">Определение по длине и виду. Хеш не раскодируется: разные алгоритмы дают одинаковую длину.</div>`;
}},
{c:"code",n:"Кодировки текста",d:"Hex, URL, двоичный вид, HTML-сущности",p:"текст или закодированная строка",f:async v=>{
  if(!v)throw new Error("Введи текст");
  const b=[...new TextEncoder().encode(v)];
  const hex=b.map(x=>x.toString(16).padStart(2,"0")).join(" ");
  const bin=b.map(x=>x.toString(2).padStart(8,"0")).join(" ");
  const url=encodeURIComponent(v);
  let du="—";try{du=decodeURIComponent(v)}catch(e){}
  let dh="—";try{const t=v.replace(/0x|\s|\\x/gi,"");if(/^([0-9a-f]{2})+$/i.test(t))dh=new TextDecoder().decode(new Uint8Array(t.match(/../g).map(x=>parseInt(x,16))))}catch(e){}
  const ent=Array.from(v).map(c=>/[\u0080-￿<>&"']/.test(c)?"&#"+c.codePointAt(0)+";":c).join("");
  return `<h3>Кодирование</h3>`+rows([["hex",esc(hex)],["двоичный",esc(bin)],["URL",esc(url)],["HTML-сущности",esc(ent)]])
  +`<h3>Если вставлена закодированная строка</h3>`+rows([["из URL",esc(du)],["из hex",esc(dh)]]);
}},
{c:"code",n:"Разбор User-Agent",d:"Браузер, система, устройство, бот",p:"Mozilla/5.0 ...",ta:true,f:async v=>{
  const s=v.trim();if(!s)throw new Error("Вставь строку User-Agent");

  const bot=/bot|crawler|spider|curl|wget|python|java\/|okhttp|headless/i.test(s);
  const br=f(/(Edg|Edge|OPR|Opera|YaBrowser|SamsungBrowser|Firefox|FxiOS|CriOS|Chrome|Safari)\//);
  const ver=f(/(?:Edg|Edge|OPR|Opera|YaBrowser|SamsungBrowser|Firefox|FxiOS|CriOS|Chrome|Safari)\/([\d.]+)/);
  const os=/Windows NT 10/.test(s)?"Windows 10/11":/Windows NT 6\.3/.test(s)?"Windows 8.1":/Windows/.test(s)?"Windows":/Android ([\d.]+)/.test(s)?"Android "+f(/Android ([\d.]+)/):/iPhone|iPad/.test(s)?"iOS "+f(/OS ([\d_]+)/,"").replace(/_/g,"."):/Mac OS X/.test(s)?"macOS":/Linux/.test(s)?"Linux":"—";
  const dev=/iPhone/.test(s)?"iPhone":/iPad/.test(s)?"iPad":/Android/.test(s)?"Android-устройство":/Mobile/.test(s)?"мобильный":/Tablet/.test(s)?"планшет":"компьютер";
  return rows([["браузер",esc(br)],["версия",esc(ver)],["система",esc(os)],["устройство",esc(dev)],["бот",bot?"да":"нет",bot?"er":"ok"],["длина",String(s.length)]])
  +`<div class="note">UA легко подделать: он говорит, чем клиент представился, а не чем является.</div>`;

{c:"util",n:"Хеши текста",d:"MD5, SHA-1, SHA-256, SHA-512",p:"текст",f:async v=>{

{c:"util",n:"Извлечь данные из текста",d:"Найти email, IP, ссылки, телефоны и @ники",p:"Вставь текст, переписку или логи",ta:true,f:async v=>{
  if(!v.trim())throw new Error("Вставь текст");
  const m=(re,f)=>[...new Set((v.match(re)||[]).map(f||(x=>x)))];
  const sets=[
    ["Email",m(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g)],
    ["IPv4",m(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g).filter(x=>x.split(".").every(n=>+n<=255))],
    ["Ссылки",m(/https?:\/\/[^\s<>"')]+/gi)],
    ["Телефоны",m(/\+\d[\d\s().-]{8,16}\d/g,x=>x.trim())],
    ["@ники",m(/(?:^|\s)@\w{4,32}/g,x=>x.trim())],
    ["Хеши",m(/\b(?:[a-f0-9]{32}|[a-f0-9]{40}|[a-f0-9]{64})\b/gi)],
    ["Домены",m(/\b(?:[a-z0-9-]+\.)+(?:com|net|org|ru|io|info|biz|xyz|me|dev|app|ua|by|kz|de|uk|cn|su)\b/gi,x=>x.toLowerCase())]
  ].filter(([,a])=>a.length);

  return sets.map(([t,a])=>`<h3>${t}: ${a.length}</h3><div class="pre">${esc(a.join("\n"))}</div>`+cpb(a.join("\n"))).join("");

function guess(v){
  v=v.trim(); if(!v) return null;
  if(/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v)) return "Проверка email";
  if(/^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$/.test(v)) return "CIDR-калькулятор";
  if(/^(\d{1,3}\.){3}\d{1,3}$/.test(v)) return "Инфо по IP";
  if(/^-?\d{1,3}\.\d+\s*,\s*-?\d{1,3}\.\d+$/.test(v)) return "Координаты";
  if(/^eyJ[\w-]+\.[\w-]+/.test(v)) return "Разбор JWT";
  if(/^([a-f0-9]{32}|[a-f0-9]{40}|[a-f0-9]{64})$/i.test(v)) return "Определить тип хеша";
  if(/^\+?\d[\d\s().-]{8,}$/.test(v)) return "Инфо по номеру";
  if(/^https?:\/\//i.test(v)) return "Разбор ссылки";
  if(/^@\w{3,}$/.test(v)) return "Профиль Телеграм";
  if(/^([a-z0-9-]+\.)+[a-z]{2,}$/i.test(v)) return "DNS-записи";
  return null;
}

    if(cur!==t) return;
    o.innerHTML=h;
    [...o.querySelectorAll(".row,.ll a,.frow,.pre,.thumb,h3,.b2,.err")].forEach((el,k)=>el.style.setProperty("--n",Math.min(k,12)));
    if(t.after) t.after();
    hist=[t.n,...hist.filter(x=>x!==t.n)].slice(0,8); store.set("osint_hist",hist);
    hap();
  }catch(e){
    if(cur===t) o.innerHTML=`<div class="err">${esc((e&&e.message)||"Ошибка")}</div>`;
  }finally{ b.disabled=false }
}

/* ---- шторки ---- */
function sheet(h){const s=$("#shade");s.innerHTML=`<div class="sheet">${h}</div>`;s.classList.remove("hide")}
function closeSheet(){const s=$("#shade");s.classList.add("hide");s.innerHTML=""}

/* ---- профиль, кошелёк, визуализаторы ---- */
async function loadMe(){
  try{ me=await api("me") }
  catch(e){
    me=null;
    $("#wlt").innerHTML=e.status===401||!tg?.initData?`<div class="note">Открой приложение через Telegram, чтобы видеть баланс и магазин.</div>`:"";
  }
  paint();
}
function paint(){
  const card=(id,title,d,hue,pill)=>`<button class="vz" data-act="viz" data-id="${id}" style="--h:${hue}"><span class="ico" style="--h:${hue}">${I.graph}</span><div class="tx"><div class="cn">${esc(title)}</div><div class="vd">${esc(d)}</div></div>${pill}</button>`;
  const items=(me&&me.items)||{sledy:{type:"viz",title:"Следы: полная версия",price:250}};
  let h="";
  Object.entries(items).filter(([,x])=>x.type==="viz").forEach(([id,x])=>{
    const own=!!me&&(me.owned||[]).includes(id), m=VIZ[id]||{};
    h+=card(id,x.title,m.d||"",m.h||"#8ea2ff",own?`<span class="pill ok">Открыть</span>`:`<span class="pill gold">${x.price} ★</span>`);
  });
  h+=card("lite",VIZ.lite.title,VIZ.lite.d,VIZ.lite.h,`<span class="pill">Демо</span>`);
  $("#vzw").innerHTML=h;
  if(!me){ $("#adw").innerHTML=""; return }
  const bal=me.unlimited?"∞":me.requests;
  $("#wlt").innerHTML=`<button class="wallet" data-act="shop"><span class="ico">${I.bolt}</span><div class="wt"><b>${bal} запросов</b><span>ID ${esc(me.id)}</span></div><span class="wb ${me.canClaim?"hot":""}">${me.canClaim?"+"+me.daily+" бесплатно":"Магазин"}</span></button>`;
  $("#adw").innerHTML=me.admin?`<button class="b2" data-act="admin" style="margin-top:10px">Админка</button>`:"";
}

function openShop(){
  if(!me){ toast("Открой приложение через Telegram"); return }
  const packs=Object.entries(me.items||{}).filter(([,x])=>x.type==="pack");
  sheet(`<h2>Магазин</h2><p class="sp1">Оплата в Telegram Stars</p>
  <div class="bal"><b>${me.unlimited?"∞":me.requests}</b><span>запросов на счёте</span></div>
  ${me.canClaim?`<button class="run" data-act="claim" style="margin:0 0 14px">Забрать ${me.daily} бесплатных</button>`:`<div class="note" style="margin:0 0 14px">Бесплатные запросы можно забирать раз в день.</div>`}
  <div class="grp">${packs.map(([id,x])=>`<button class="item" data-act="buy" data-id="${id}"><div class="tx"><div class="cn">${esc(x.title)}</div><div class="cd">${x.requests} запросов</div></div><span class="price">${x.price} ★</span></button>`).join("")}</div>
  <p class="fine">Вопросы по оплате и возвратам: команда /paysupport в боте.</p>`);
}
async function claim(){
  try{ me=await api("claim"); paint(); openShop(); toast("Запросы начислены") }
  catch(e){ toast(e.status===409?"Сегодня уже забирал":e.message) }
}
async function buy(id){
  try{
    const r=await api("invoice",{item:id});
    if(tg?.openInvoice){
      tg.openInvoice(r.link,s=>{
        if(s==="paid"){ toast("Оплачено"); closeSheet(); setTimeout(loadMe,1500); setTimeout(loadMe,5000) }
        else if(s==="failed") toast("Оплата не прошла");
      });
    }else openUrl(r.link);
  }catch(e){ toast(e.status===409?"Уже куплено":e.message) }
}
function vizSheet(id){
  const x=me?.items?.[id]; if(!x) return;
  const m=VIZ[id]||{};
  sheet(`<h2>${esc(x.title)}</h2><p class="sp1">${esc(m.d||"")}</p>
  <div class="feat"><b>Что внутри</b><ul>${(m.f||[]).map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
  <button class="run" data-act="buy" data-id="${id}" style="margin-top:6px">Купить за ${x.price} ★</button>
  <button class="b2 wide" data-act="viz" data-id="lite">Сначала посмотреть демо</button>
  <p class="fine">Покупка даёт личный доступ. Доска открывается по временной ссылке, отдельного файла у покупателя нет.</p>`);
}
async function openViz(id){
  if(!me){ toast("Открой приложение через Telegram"); return }
  if(id!=="lite"&&!(me.owned||[]).includes(id)){ vizSheet(id); return }
  closeSheet(); toast("Открываю…");
  try{
    const r=await api("viz-token",{id});
    openUrl(location.origin+"/api/viz-open?t="+encodeURIComponent(r.token));
  }catch(e){ if(e.status===403) vizSheet(id); else toast(e.message) }
}

/* ---- админка ---- */
async function openAdmin(){
  sheet(`<h2>Админка</h2><p class="sp1">Загрузка…</p>`);
  let d;
  try{ d=await api("admin/users") }catch(e){ sheet(`<div class="err">${esc(e.message)}</div>`); return }
  const s=d.stat||{};
  sheet(`<h2>Админка</h2><p class="sp1">Пользователей: ${s.users||0} · задач: ${s.jobs||0} · операций: ${s.ops||0}</p>
  <input class="f" id="adn" placeholder="@username или ID" autocomplete="off" autocapitalize="off" spellcheck="false">
  <input class="f" id="ada" type="number" inputmode="numeric" placeholder="Сколько запросов выдать" style="margin-top:10px">
  <div class="adm">
    <button class="b2" data-act="adm" data-do="add">Выдать запросы</button>
    <button class="b2" data-act="adm" data-do="unl1">Безлимит вкл</button>
    <button class="b2" data-act="adm" data-do="unl0">Безлимит выкл</button>
    <button class="b2" data-act="adm" data-do="own">Выдать «Следы»</button>
    <button class="b2" data-act="adm" data-do="rev">Сбросить ссылки</button>
    <button class="b2" data-act="adm" data-do="self">Мне безлимит</button>
  </div>
  <div class="gh">Последние пользователи</div>
  <div class="grp">${(d.users||[]).slice(0,30).map(u=>`<div class="row"><div class="k">${esc(u.id)}</div><div class="v">${u.unlimited?"∞":esc(u.credits)}</div></div>`).join("")}</div>`);
}
async function adm(a){
  try{
    if(a==="self"){ me=await api("admin/self"); paint(); toast("Безлимит включён"); return }
    const v=($("#adn")?.value||"").trim();
    if(!v){ toast("Укажи @username или ID"); return }
    const id=/^\d+$/.test(v)?+v:(await api("admin/find",{username:v})).id;
    if(a==="rev"){ const r=await api("admin/revoke",{id}); toast("Ссылок сброшено: "+r.killed); return }
    const b={id};
    if(a==="add"){ const n=+($("#ada")?.value); if(!n){ toast("Укажи число запросов"); return } b.add=n }
    if(a==="unl1") b.unlimited=true;
    if(a==="unl0") b.unlimited=false;
    if(a==="own") b.owned=true;
    const r=await api("admin/set",b);
    toast("Готово: ID "+r.user.id+", запросов "+r.user.credits);
  }catch(e){ toast(e.message) }
}

/* ---- события ---- */
document.addEventListener("click",async e=>{
  if(e.target.id==="shade"){ closeSheet(); return }
  const c=e.target.closest("[data-copy]");
  if(c){ copy(c.dataset.copy); return }
  const l=e.target.closest("#tool a[href^='http']");
  if(l&&tg?.openLink){ e.preventDefault(); tg.openLink(l.href); return }
  const a=e.target.closest("[data-act]");
  if(!a) return;
  const k=a.dataset.act;
  hap();
  if(k==="open") openTool(T[+a.dataset.i]);
  else if(k==="sg") openTool(T.find(t=>t.n===a.dataset.n),$("#q").value.trim(),true);
  else if(k==="back") closeTool();
  else if(k==="run") run();
  else if(k==="cat"){ cat=a.dataset.c; chips(); render(true) }
  else if(k==="fav"&&cur){
    favs=favs.includes(cur.n)?favs.filter(x=>x!==cur.n):[...favs,cur.n];
    store.set("osint_fav",favs); a.classList.toggle("on",favs.includes(cur.n));
  }
  else if(k==="clrh"){ hist=[]; store.set("osint_hist",hist); render(false) }
  else if(k==="shop") openShop();
  else if(k==="claim") await claim();
  else if(k==="buy") await buy(a.dataset.id);
  else if(k==="viz") await openViz(a.dataset.id);
  else if(k==="admin") await openAdmin();
  else if(k==="adm") await adm(a.dataset.do);
});
$("#q").addEventListener("input",()=>{ sugg(); render(false) });
$("#q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const n=guess($("#q").value); if(n) openTool(T.find(t=>t.n===n),$("#q").value.trim(),true) }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(!$("#shade").classList.contains("hide")) closeSheet(); else if(cur) closeTool() }
});
try{ tg?.BackButton?.onClick(()=>{ if(!$("#shade").classList.contains("hide")) closeSheet(); else if(cur) closeTool() }) }catch(e){}

chips(); render(true); sugg(); loadMe();
</script>
<script src="/hub-plus.js"></script>
</body>
