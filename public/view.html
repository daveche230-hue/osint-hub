<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Следы</title>
<style>
html,body{margin:0;height:100%;background:#0a0c11;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block}
#e{color:#8593a3;font:15px/1.5 system-ui;padding:60px 24px;text-align:center}
#e b{color:#eef2f6;display:block;margin-bottom:8px;font-size:17px}
</style>
</head>
<body>
<iframe id="f" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
<script>
var t = new URLSearchParams(location.search).get("t");
var f = document.getElementById("f");
if (!t) {
  document.body.innerHTML = '<div id="e"><b>Нет токена</b>Открой доску заново.</div>';
} else {
  fetch("/api/viz-open?t=" + encodeURIComponent(t)).then(function (r) {
    if (!r.ok) throw new Error("Ссылка недействительна. Открой доску заново.");
    return r.text();
  }).then(function (h) {
    f.srcdoc = h;
  }).catch(function (e) {
    document.body.innerHTML = '<div id="e"><b>Не открылось</b>' + e.message + '</div>';
  });
}
</script>
</body>
</html>
